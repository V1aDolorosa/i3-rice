
; =========================================
; POLYBAR — KANAGAWA WAVE
; Transparent bar + Milk wallpaper
; =========================================

[colors]
; Kanagawa base
background      = #16161D
background-alt  = #1F1F28
foreground      = #2A2A37
muted           = #54546D

; Darkened Kanagawa accents for light wallpaper
accent          = #455A7A
violet          = #715B8F
pink            = #9C526D
yellow          = #80642F
green           = #5A713F
alert           = #A64752
aqua            = #286C73
; =========================================
; BAR
; =========================================

[bar/main]
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
bottom = false

foreground = ${colors.foreground}

; 100% transparent
background = #0016161D

line-size = 1
line-color = #A9A38E
border-size = 0

padding-left = 1
padding-right = 1
module-margin = 0
separator = "  "

font-0 = JetBrainsMono Nerd Font:style=Regular:size=12;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=13;2
font-2 = JetBrainsMono Nerd Font:style=Bold:size=25;2

modules-left = i3
modules-center = title
modules-right = wifi bluetooth xkeyboard volume battery power

wm-restack = i3
override-redirect = false
enable-ipc = true

; =========================================
; WORKSPACES
; =========================================

[module/i3]
type = internal/i3

pin-workspaces = true
show-urgent = true
strip-wsnumbers = true

ws-icon-0 = 1;
ws-icon-1 = 2;2:
ws-icon-2 = 3;3:
ws-icon-3 = 4;4:
ws-icon-4 = 5;5:󰌽
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 10;10

ws-icon-default = 󰌽

; Focused
label-focused = %icon%
label-focused-background = ${colors.accent}
label-focused-foreground = #DCD7BA
label-focused-padding = 2

; Unfocused
label-unfocused = %icon%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

; Visible
label-visible = %icon%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

; Urgent
label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-foreground = #DCD7BA
label-urgent-padding = 2

; =========================================
; DATE / CLOCK
; =========================================

[module/title]
type = internal/date
interval = 1

time = %a, %d %b %H:%M:%S
time-alt = %d.%m.%Y

label = %time%
label-foreground = ${colors.foreground}

; =========================================
; WIFI
; =========================================

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi.sh
interval = 5

format = <label>
format-padding = 1

label = %output%
label-foreground = ${colors.aqua}

click-left = nm-connection-editor

; =========================================
; BLUETOOTH
; =========================================

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5

format = <label>
format-padding = 1

label = %output%
label-foreground = ${colors.violet}

click-left = blueman-manager

; =========================================
; KEYBOARD
; =========================================

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

layout-icon-0 = US;EN
layout-icon-1 = RU;RU

label-layout = [%layout%]
label-layout-foreground = ${colors.accent}

; =========================================
; VOLUME
; =========================================

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 1

format = <label>
format-padding = 1

label = %output%
label-foreground = ${colors.accent}

click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = pavucontrol

scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

; =========================================
; BATTERY
; =========================================

[module/battery]
type = internal/battery

battery = BAT1
adapter = ADP1
poll-interval = 5

; Charging
format-charging = <label-charging>
label-charging = 󰂄  %percentage%%
label-charging-foreground = ${colors.green}

; Discharging
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

; Battery icons
ramp-capacity-0 = 󰂃
ramp-capacity-0-foreground = ${colors.alert}

ramp-capacity-1 = 󰁻
ramp-capacity-1-foreground = ${colors.violet}

ramp-capacity-2 = 󰁾
ramp-capacity-2-foreground = ${colors.accent}

ramp-capacity-3 = 󰂀
ramp-capacity-3-foreground = ${colors.aqua}

ramp-capacity-4 = 󰁹
ramp-capacity-4-foreground = ${colors.green}

; Full
format-full = <label-full>
label-full = 󰁹 %percentage%%
label-full-foreground = ${colors.green}

; =========================================
; POWER
; =========================================

[module/power]
type = custom/text

content = 󰐥
content-foreground = ${colors.alert}
content-padding = 1

click-left = ~/.config/polybar/scripts/power-menu.sh
