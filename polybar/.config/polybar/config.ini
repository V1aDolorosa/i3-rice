; =========================================
; POLYBAR | TOKYO NIGHT STORM
; =========================================

[colors]
background      = #24283B
background-alt  = #1F2335
surface         = #292E42
foreground      = #C0CAF5
muted           = #565F89

blue            = #7AA2F7
cyan            = #7DCCFF
purple          = #BB9AF7
teal            = #73DACA
green           = #9ECE6A
yellow          = #E0AF68
red             = #F7768E

; =========================================
; BAR
; =========================================

[bar/main]
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
bottom = false

background = #0024283B
foreground = ${colors.foreground}

line-size = 1
line-color = ${colors.blue}
border-size = 0

padding-left = 1
padding-right = 1
module-margin = 0
separator = "  "

font-0 = JetBrainsMono Nerd Font:style=Regular:size=12;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=13;2
font-2 = JetBrainsMono Nerd Font:style=Bold:size=25;2

modules-left = i3
modules-center = title
modules-right = wifi bluetooth xkeyboard volume battery power

override-redirect = true
wm-restack = i3
enable-ipc = true

; =========================================
; WORKSPACES
; =========================================

[module/i3]
type = internal/i3

pin-workspaces = true
show-urgent = true
strip-wsnumbers = true

ws-icon-0 = 1;
ws-icon-1 = 2;2:
ws-icon-2 = 3;3:
ws-icon-3 = 4;4:
ws-icon-4 = 5;5:󰌽
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 10;10

ws-icon-default = 󰌽

label-focused = %icon%
label-focused-background = ${colors.blue}
label-focused-foreground = ${colors.background-alt}
label-focused-padding = 2

label-unfocused = %icon%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

label-visible = %icon%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %icon%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.background-alt}
label-urgent-padding = 2

; =========================================
; DATE / CLOCK
; =========================================

[module/title]
type = internal/date
interval = 1

time = %a, %d %b %H:%M:%S
time-alt = %d.%m.%Y

label = %time%
label-foreground = ${colors.foreground}

; =========================================
; WIFI
; =========================================

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi.sh
interval = 5

format = <label>
format-padding = 1

label = %output%
label-foreground = ${colors.teal}

click-left = nm-connection-editor

; =========================================
; BLUETOOTH
; =========================================

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5

format = <label>
format-padding = 1

label = %output%
label-foreground = ${colors.purple}

click-left = blueman-manager

; =========================================
; KEYBOARD
; =========================================

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

layout-icon-0 = US;EN
layout-icon-1 = RU;RU

label-layout = [%layout%]
label-layout-foreground = ${colors.blue}

; =========================================
; VOLUME
; =========================================

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 1

format = <label>
format-padding = 1

label = %output%
label-foreground = ${colors.cyan}

click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = pavucontrol

scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

; =========================================
; BATTERY
; =========================================

[module/battery]
type = internal/battery

battery = BAT1
adapter = ADP1
poll-interval = 5

format-charging = <label-charging>
label-charging = 󰂄  %percentage%%
label-charging-foreground = ${colors.green}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

ramp-capacity-0 = 󰂃
ramp-capacity-0-foreground = ${colors.red}

ramp-capacity-1 = 󰁻
ramp-capacity-1-foreground = ${colors.purple}

ramp-capacity-2 = 󰁾
ramp-capacity-2-foreground = ${colors.blue}

ramp-capacity-3 = 󰂀
ramp-capacity-3-foreground = ${colors.teal}

ramp-capacity-4 = 󰁹
ramp-capacity-4-foreground = ${colors.green}

format-full = <label-full>
label-full = 󰁹 %percentage%%
label-full-foreground = ${colors.green}

; =========================================
; POWER
; =========================================

[module/power]
type = custom/text

format = <label>
label = 󰐥
label-foreground = ${colors.red}
label-padding = 1

click-left = ~/.config/polybar/scripts/power-menu.sh
