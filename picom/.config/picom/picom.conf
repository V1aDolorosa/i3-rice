# Rendering
backend = "glx";
vsync = true;

# Window opacity
active-opacity = 0.92;
inactive-opacity = 0.82;
frame-opacity = 0.90;
inactive-opacity-override = false;

# Shadows
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.30;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000";

# Fade animations
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# Blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

# Keep desktop and popup elements clear
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'tooltip'",
  "window_type = 'notification'"
];

# Rounded corners
corner-radius = 12;
